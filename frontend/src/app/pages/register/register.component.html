<!-- This is a simple registration form using Tailwind CSS for styling. It includes fields for email, password, and confirm password. The form is centered on the page with a clean and modern design. -->
<!-- component -->
<div class="min-h-screen bg-gray-900 flex items-center justify-center p-4">
  <div class="max-w-md w-full bg-gray-800 rounded-xl shadow-lg p-8">
    <h2 class="text-2xl font-bold text-gray-300 mb-6 text-center">Register</h2>
    <p class="text-sm text-gray-500 mb-4 text-center">
      Create an account to start using our services.
    </p>
    <form class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-gray-300 mb-1">Email</label>
        <input 
          type="email" 
          class="w-full px-4 py-2 border border-gray-300 bg-gray-900 text-gray-800 placeholder-gray-500 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-green-500 outline-none transition-all"
          placeholder="your@email.com"
        />
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-300 mb-1">Password</label>
        <input 
          type="password" 
          class="w-full px-4 py-2 border border-gray-300 bg-gray-900 text-gray-800 placeholder-gray-500 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-green-500 outline-none transition-all"
          placeholder="••••••••"
        />
      </div>
        <div>
            <label class="block text-sm font-medium text-gray-300 mb-1">Confirm Password</label>
            <input 
            type="password" 
            class="w-full px-4 py-2 border border-gray-300 bg-gray-900 text-gray-800 placeholder-gray-500 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-green-500 outline-none transition-all"
            placeholder="••••••••"
            />
        </div>

      <div class="flex items-center justify-between">
      </div>

      <button class="w-full bg-green-600 hover:bg-green-400 text-white font-medium py-2.5 rounded-lg transition-colors">
        Register
      </button>
    </form>

    <div class="mt-6 text-center text-sm text-gray-500">
      Already have an account? 
      <a href="/login" class="text-green-500 hover:text-green-400 font-medium">Sign In</a>
    </div>
  </div>
</div>
