<!-- Codelet Upload View | coderepo.net -->
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Create a Codelet • coderepo.net</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-gray-900 text-white font-sans">

    <!-- Navbar -->
    <nav class="flex items-center justify-between px-4 py-3 bg-gray-800 shadow-sm">
      <div class="flex items-center space-x-2">
        <button
          aria-label="Toggle menu"
          class="text-white focus:outline-none focus:ring-2 focus:ring-blue-400 rounded-md"
        >
          &#9776;
        </button>
        <a href="#" class="text-xl font-bold">coderepo.net</a>
      </div>
      <div class="flex items-center space-x-4">
        <button
          class="relative focus:outline-none focus:ring-2 focus:ring-blue-400 rounded-full"
          aria-label="Notifications"
        >
          <span class="absolute -top-1 -right-1 flex h-3 w-3">
            <span
              class="animate-ping absolute inline-flex h-full w-full rounded-full bg-red-400 opacity-75"
            ></span>
            <span class="relative inline-flex rounded-full h-3 w-3 bg-red-500"></span>
          </span>
          🔔
        </button>
        <img
          src="https://placehold.co/32x32"
          class="w-8 h-8 rounded-full border border-gray-700"
          alt="Profile"
        />
      </div>
    </nav>

    <!-- Main Content Container -->
    <main class="max-w-4xl mx-auto px-4 mt-8 mb-16">
      <h1 class="text-2xl font-semibold mb-4">Create a New Codelet</h1>

      <!-- Form Card -->
      <form
        action="#"
        method="POST"
        class="bg-gray-800 p-6 rounded-2xl shadow-md space-y-6"
      >
        <!-- Title -->
        <div>
          <label for="title" class="block text-sm font-medium mb-1">Title</label>
          <input
            type="text"
            id="title"
            name="title"
            placeholder="e.g. Quick Sort Implementation"
            required
            class="w-full px-4 py-2 bg-gray-900 border border-gray-700 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
          />
        </div>

        <!-- Technology / Language -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <div>
            <label for="language" class="block text-sm font-medium mb-1">Language</label>
            <select
              id="language"
              name="language"
              class="w-full px-4 py-2 bg-gray-900 border border-gray-700 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
            >
              <option>Python</option>
              <option>JavaScript</option>
              <option>Lua</option>
              <option>Rust</option>
              <option>C++</option>
              <option>Other</option>
            </select>
          </div>
          <div>
            <label for="tech" class="block text-sm font-medium mb-1">Technology / Framework</label>
            <input
              type="text"
              id="tech"
              name="tech"
              placeholder="e.g. Flask, React, Vanilla JS..."
              class="w-full px-4 py-2 bg-gray-900 border border-gray-700 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
            />
          </div>
        </div>

        <!-- Summary / Description -->
        <div>
          <label for="summary" class="block text-sm font-medium mb-1">Short Description</label>
          <textarea
            id="summary"
            name="summary"
            rows="3"
            placeholder="A brief one‑line summary of what this Codelet does..."
            class="w-full px-4 py-2 bg-gray-900 border border-gray-700 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 resize-none"
          ></textarea>
        </div>

        <!-- Code Editor -->
        <div>
          <label for="code" class="block text-sm font-medium mb-1">Code</label>
          <textarea
            id="code"
            name="code"
            rows="12"
            placeholder="Paste or write your code here..."
            class="w-full px-4 py-2 font-mono bg-gray-900 border border-gray-700 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 resize-y"
          ></textarea>
          <p class="text-xs text-gray-400 mt-1">
            *Syntax highlighting & preview will be applied after publishing.
          </p>
        </div>

        <!-- Documentation -->
        <div>
          <label for="docs" class="block text-sm font-medium mb-1">Documentation</label>
          <textarea
            id="docs"
            name="docs"
            rows="6"
            placeholder="Explain how to use your Codelet, include examples, references, etc. Markdown supported."
            class="w-full px-4 py-2 bg-gray-900 border border-gray-700 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 resize-y"
          ></textarea>
        </div>

        <!-- Tags -->
        <div>
          <label for="tags" class="block text-sm font-medium mb-1">Tags</label>
          <input
            type="text"
            id="tags"
            name="tags"
            placeholder="e.g. sorting, algorithms, data‑structures"
            class="w-full px-4 py-2 bg-gray-900 border border-gray-700 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
          />
        </div>

        <!-- Actions -->
        <div class="flex flex-col md:flex-row md:items-center md:justify-between space-y-4 md:space-y-0">
          <div class="flex space-x-3">
            <button
              type="submit"
              class="px-6 py-2 bg-blue-600 hover:bg-blue-700 rounded-lg font-medium focus:outline-none focus:ring-2 focus:ring-blue-400"
            >
              Publish Codelet
            </button>
            <button
              type="button"
              class="px-6 py-2 bg-gray-700 hover:bg-gray-600 rounded-lg font-medium focus:outline-none focus:ring-2 focus:ring-gray-400"
            >
              Preview
            </button>
          </div>
          <a
            href="#"
            class="text-sm text-gray-400 underline hover:text-gray-300"
          >
            Need help writing good docs?
          </a>
        </div>
      </form>
    </main>
  </body>
</html>
