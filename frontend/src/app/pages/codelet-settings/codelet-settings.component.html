<main class="bg-gray-900 text-white py-10 px-4">
  <div class="max-w-4xl mx-auto bg-gray-800 rounded-2xl shadow-lg p-8 space-y-6">
    <h2 class="text-3xl font-semibold mb-4 text-center">Edit Codelet</h2>

    <div>
      <label class="block text-sm font-medium text-gray-300 mb-1">Title</label>
      <input [(ngModel)]="title" class="w-full p-3 rounded bg-gray-700 text-white focus:outline-none focus:ring-2 focus:ring-blue-500" />
    </div>

    <div>
      <label class="block text-sm font-medium text-gray-300 mb-1">Description</label>
      <textarea [(ngModel)]="description" rows="3" class="w-full p-3 rounded bg-gray-700 text-white focus:outline-none focus:ring-2 focus:ring-blue-500"></textarea>
    </div>

    <div>
      <label class="block text-sm font-medium text-gray-300 mb-1">Language</label>
      <select [(ngModel)]="selectedLanguage" (change)="onLanguageChange()" class="w-full p-3 rounded bg-gray-700 text-white focus:outline-none focus:ring-2 focus:ring-blue-500">
        <option *ngFor="let lang of languages" [value]="lang">{{ lang }}</option>
      </select>
    </div>

    <div>
      <label class="block text-sm font-medium text-gray-300 mb-1">Code</label>
      <textarea [(ngModel)]="code" rows="10" class="w-full p-3 rounded font-mono bg-gray-900 text-green-300 focus:outline-none focus:ring-2 focus:ring-blue-500"></textarea>
    </div>

    <div class="flex justify-end">
      <button (click)="saveChanges()" class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-2 rounded-lg transition duration-200">
        💾 Save Changes
      </button>
    </div>
  </div>
</main>
