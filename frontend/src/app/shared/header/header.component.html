<header class="bg-gray-800 text-white px-6 py-4 flex items-center justify-between shadow-md relative">
  <div class="w-1/3"></div>

  <!-- Logo centrado -->
  <div class="w-1/3 flex justify-center">
    <a href="/">
      <img src="https://i.pinimg.com/736x/11/9c/cf/119ccfb7c0558e04c2517c3e941f2116.jpg" alt="CodeRepo Logo" class="h-8 w-auto" />
    </a>
  </div>

  <!-- Navbar -->
  <nav class="space-x-4"></nav>

  <!-- Perfil + Notificaciones -->
  <div class="flex items-center space-x-4 relative">
    <button class="relative" (click)="toggleNotifications()">
      <span class="absolute -top-1 -right-1 bg-red-500 text-xs rounded-full px-1">3</span>
      <span class="oi oi-bell text-lg"></span>
    </button>
    <a href="/my-profile">
      <img [src]="avatarUrl" alt="User Avatar" class="w-8 h-8 rounded-full" />
    </a>

    <!-- Panel de notificaciones -->
    <div *ngIf="showNotifications" class="absolute top-10 right-0 w-64 bg-white text-black rounded shadow-lg p-4 z-50">
      <p class="font-semibold mb-2">Notificaciones</p>
      <ul class="space-y-2">
        <li class="text-sm">🔔 Codelet nuevo de un usuario que sigues</li>
        <li class="text-sm">💬 Comentario en tu Codelet</li>
        <li class="text-sm">📌 Codelet guardado por otro usuario</li>
      </ul>
    </div>
  </div>
</header>
