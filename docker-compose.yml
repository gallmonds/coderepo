services:
  api:
    build:
      context: ./coderepo_api/
      dockerfile: Dockerfile
    ports:
      - "5131:5131"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    depends_on:
      - postgresql
  postgresql:
    build:
      context: ./postgres
      dockerfile: Dockerfile
    container_name: postgres_db
    restart: always
    ports:
      - 5432:5432
    environment:
      - POSTGRES_PASSWORD=dockerpsql123
      - POSTGRES_USER=dockerpsql
      - POSTGRES_DB=coderepo_db
      - POSTGRES_ROOT_PASSWORD=root1760
    volumes:
      - ./postgres/data:/var/lib/postgresql/data
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "4200:4200"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true

