services:
  frontend:
    build:
      context: ./frontend/coderepo
      dockerfile: ../Dockerfile
    container_name: coderepo-ui
    networks:
      - app-network

  nginx:
    build: ./nginx
    container_name: coderepo-nginx
    ports:
      - "80:80"
    depends_on:
      - frontend
    volumes:
      - ./frontend/coderepo/dist/coderepo:/usr/share/nginx/html:ro
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
