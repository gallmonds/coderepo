services:
  api:
    build:
      context: ./coderepo_api/
      dockerfile: Dockerfile
    ports:
      - "5131:5131"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    depends_on:
      - postgresql
      - static-server
    volumes:
      - ./static:/app/static
  postgresql:
    build:
      context: ./postgres
      dockerfile: Dockerfile
    container_name: postgres_db
    restart: always
    ports:
      - 5432:5432
    environment:
      - POSTGRES_PASSWORD=dockerpsql123
      - POSTGRES_USER=dockerpsql
      - POSTGRES_DB=coderepo_db
      - POSTGRES_ROOT_PASSWORD=root1760
    volumes:
      - ./postgres/data:/var/lib/postgresql/data
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "4200:4200"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - ./static:/app/static
    environment:
      - CHOKIDAR_USEPOLLING=true
  static-server:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./static:/usr/share/nginx/html/static:rw
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    restart: unless-stopped

