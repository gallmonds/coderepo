<div class="min-h-screen bg-gray-900 flex items-center justify-center p-4">
  <div class="max-w-md w-full bg-gray-800 rounded-xl shadow-lg p-8">
    <h2 class="text-2xl font-bold text-gray-300 mb-6 text-center">Sign In</h2>
    
    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-4">

      <!-- Username -->
      <div>
        <label class="block text-sm font-medium text-gray-300 mb-1">Username</label>
        <input 
          type="text"
          formControlName="username"
          class="w-full px-4 py-2 border border-gray-300 rounded-lg bg-gray-900 text-gray-300 placeholder-gray-500 focus:ring-2 focus:ring-green-500 focus:border-green-500 outline-none transition-all"
          placeholder="username"
        />
        <div *ngIf="form.get('username')?.touched && form.get('username')?.invalid" class="text-red-400 text-sm mt-1">
          <div *ngIf="form.get('username')?.errors?.['required']">Username is required.</div>
        </div>
      </div>
      
      <!-- Password -->
      <div>
        <label class="block text-sm font-medium text-gray-300 mb-1">Password</label>
        <input 
          type="password"
          formControlName="password"
          class="w-full px-4 py-2 border border-gray-300 rounded-lg bg-gray-900 text-gray-800 placeholder-gray-500 focus:ring-2 focus:ring-green-500 focus:border-green-500 outline-none transition-all"
          placeholder="••••••••"
        />
        <div *ngIf="form.get('password')?.touched && form.get('password')?.invalid" class="text-red-400 text-sm mt-1">
          <div *ngIf="form.get('password')?.errors?.['required']">Password is required.</div>
        </div>
      </div>

      <button type="submit" class="w-full bg-green-600 hover:bg-green-400 text-white font-medium py-2.5 rounded-lg transition-colors">
        Sign In
      </button>
    </form>
    
    <div *ngIf="isLoading" class="flex justify-center mt-4">
      <div class="w-6 h-6 border-4 border-green-400 border-t-transparent rounded-full animate-spin"></div>
    </div>

    <div *ngIf="errorMsg" class="mt-4 text-red-400 text-sm text-center">
      {{ errorMsg }}
    </div>


    <div class="mt-6 text-center text-sm text-gray-500">
      Don't have an account? 
      <a href="/register" class="text-green-500 hover:text-green-400 font-medium">Sign up</a>
    </div>
  </div>
</div>
