<header class="fixed top-0 left-0 w-full z-50 bg-gray-800 text-white px-4 py-3 shadow-md">
  <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4">

    <!-- Logo -->
    <div class="flex justify-center md:justify-start w-full md:w-auto">
      <a href="/">
        <img 
          src="images/coderepoLogo.png"
          alt="CodeRepo Logo" 
          class="h-12 md:h-16 w-auto max-w-[200px] object-contain"
        />
      </a>
    </div>

    <!-- Search Bar -->
    <div class="w-full md:flex-1 md:mx-6">
      <input 
        type="text"
        placeholder="Search Codelets..."
        [(ngModel)]="searchText"
        (keydown)="onSearchKey($event)"
        class="w-full bg-gray-700 text-white placeholder-gray-400 px-4 py-2 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500"
      />
    </div>

    <!-- User Info or Guest Links -->
    <div class="md:static absolute top-3 right-4 flex items-center gap-4 w-fit">
      <ng-container *ngIf="user; else guestLinks">
        <a [routerLink]="['/user', user.id]" class="flex items-center gap-2 hover:underline">
          <img 
            [src]="avatarUrl" 
            alt="User Avatar" 
            class="w-10 h-10 sm:w-12 sm:h-12 rounded-full border border-white"
          />
          <span class="hidden sm:inline text-base font-medium">{{ user.username }}</span>
        </a>
      </ng-container>

      <ng-template #guestLinks>
        <a href="/login" class="text-sm hover:underline">Log In</a>
        <a 
          href="/register" 
          class="bg-green-600 hover:bg-green-500 text-white text-sm px-3 py-1.5 rounded-lg transition"
        >
          Sign Up
        </a>
      </ng-template>
    </div>

  </div>
</header>
