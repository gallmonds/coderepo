services:
  postgres:
    image: postgres:14-alpine
    ports:
      - 5432:5432
    volumes:
      - /apps/postgres:/var/lib/postgresql/data
    environment:
      - POSTGRES_PASSWORD=dockerpsql123
      - POSTGRES_USER=docker-psql
      - POSTGRES_DB=crdb

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "4200:4200"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
